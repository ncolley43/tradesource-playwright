name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Allows the pipeline to be run manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build --if-present

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Start the TradeSource site in the background and wait until it responds
      - name: Start TradeSource site
        run: |
          npm start > site.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4321 > /dev/null; then
              echo "Site is up at http://localhost:4321"
              exit 0
            fi
            sleep 1
          done
          echo "Site did not start within 30 seconds"
          cat site.log
          exit 1

      - name: Run Playwright tests
        run: npm test

      # Runs even if tests fail, so the report is always available
      - name: Upload HTML test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
